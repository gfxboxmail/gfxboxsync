<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>GFXBox Sync</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 16px; color: #ddd; background: #202020; }
      button, select { width: 100%; margin: 6px 0; padding: 8px; }
      .result { border: 1px solid #555; padding: 10px; margin-top: 12px; }
    </style>
  </head>
  <body>
    <h2>GFXBox Sync</h2>
    <label>Reference track</label>
    <select id="reference"><option>Selected reference clip</option></select>
    <button id="analyze">Analyze selected clips</button>
    <button id="apply" disabled>Apply proposed offsets</button>
    <div id="status" class="result">Select timeline clips to begin.</div>
    <script src="main.js"></script>
  </body>
</html>
